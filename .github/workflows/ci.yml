name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GITHUB_TOKEN scopes are pinned HERE rather than inherited from the repository's
# Settings → Actions → General → "Workflow permissions" default. On 2026-08-20 that default
# stopped granting `pull-requests` and three jobs went red on `Resource not accessible by
# integration` — including the gitleaks secret scan — with no change to this repo at all.
# A setting that never appears in a diff must not decide what CI may do.
# NOTE: `permissions:` REPLACES, it does not merge — naming any scope sets every unnamed scope
# to `none`, so each job-level block below repeats `contents: read` for actions/checkout.
# Pinned by backend/tests/ciWorkflowPermissions.test.js.
permissions:
  contents: read

jobs:
  secret-scan:
    name: Security — gitleaks secret scan
    runs-on: ubuntu-latest
    # The gitleaks CLI, not gitleaks-action. The action built a PR's range from the PR's commit
    # list (GET /pulls/:number/commits) and read only its first page, 30 commits, so a longer PR
    # was scanned in part and still passed: run 37199191703 (PR #216) logged "30 commits scanned".
    # The range now comes from the event payload, so no API call is made and no scope beyond
    # contents is needed. Pinned by backend/tests/secretScanGates.test.js.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Both ends of the range must be in the clone. This job scans only THIS event's
          # commits; the full-history sweep runs weekly in secret-scan-history.yml.
          fetch-depth: 0
      # A pinned release, and the archive's SHA-256 is checked before anything in it runs. The hash
      # is the one in the release's gitleaks_8.24.3_checksums.txt; a new version changes both.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      # Every commit this event adds, as an explicit range:
      #   · pull_request: base..head, every commit of the PR, however many;
      #   · push: before..sha, every pushed commit. `before` is all zeros when the push created the
      #     branch, and then every commit reachable from sha is new.
      # Any other event fails instead of scanning nothing. The range goes to gitleaks as it is: no
      # --first-parent, which would drop the commits a PR brings in by merging another branch.
      # gitleaks exits 1 on any finding, and on a range git cannot resolve; either fails the job.
      # It reads .gitleaksignore from the checkout root.
      - name: gitleaks
        env:
          PR_RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_RANGE: ${{ github.event.before }}..${{ github.sha }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) range="$PR_RANGE" ;;
            push)
              if [ "$PUSH_BEFORE" = 0000000000000000000000000000000000000000 ]; then range="$GITHUB_SHA"; else range="$PUSH_RANGE"; fi ;;
            *) echo "::error::secret-scan has no commit range for a $GITHUB_EVENT_NAME event"; exit 1 ;;
          esac
          commits=$(git rev-list --count "$range")
          echo "gitleaks scans $range: $commits commits"
          "$RUNNER_TEMP/gitleaks" git --log-opts="$range" --redact --verbose --exit-code=1 --no-banner .

  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: backend
      - name: Run tests
        run: npm test
        working-directory: backend

  mobile:
    name: Mobile — jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'   # satisfies engines (node >= 22.11.0). The ProfileScreen async
                               # flush flake (issue #84 / ADR 0007) was root-caused and fixed
                               # in the test (deterministic setImmediate flush); node 24 is now
                               # a deliberate target, no longer a workaround.
          cache: 'npm'
          cache-dependency-path: mobile/KokonadaHealth/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: mobile/KokonadaHealth
      # jest only — NOT `tsc`: pre-existing src/health/* typing errors are documented and
      # unrelated (see ORCHESTRATOR_FABLE definition_of_done). Local gate parity.
      - name: Run tests
        run: ./node_modules/.bin/jest --ci
        working-directory: mobile/KokonadaHealth
      # The design-system gate: colour and scale values that bypass src/design/tokens.ts are
      # ERRORS, and this step FAILS the build on them. It runs the same .eslintrc.js as
      # `npm run lint`, keeps only the kokonada/* messages, and ratchets them against
      # scripts/lint/design-system-baseline.json. Deliberately not plain `npm run lint`: that
      # also carries unrelated pre-existing debt, and what gates this must be off-system values,
      # not whichever lint error happens to be lying around. The baseline file holds the existing
      # violations (recorded there, not fixed — that cleanup is its own reviewable change); the job
      # goes red the moment any file goes ABOVE its recorded count, a new hex in an
      # already-listed file included.
      - name: Design-system lint
        run: npm run lint:design-system
        working-directory: mobile/KokonadaHealth
      # The Design Lab must be ABSENT from every build that can be uploaded (MB-084; Apple 2.3.1(a)
      # with 2.2; Play Deceptive Behavior). This bundles index.js exactly as the release Gradle task
      # does (Metro --dev false, then hermesc), scans the JS, the sourcemap and the bytecode for any
      # lab trace, and runs the same pipeline over index.lab.js as a positive control, so a clean
      # result means the scan could see the lab. Exit 2 (the check could not run) fails too.
      - name: Design Lab exclusion
        run: node scripts/lab/assertLabExcluded.mjs
        working-directory: mobile/KokonadaHealth
      # The same check on the iOS release bundle (Metro --platform ios, then hermesc), so QA-077
      # clause A3 ("for Android and for iOS") holds on every PR.
      - name: Design Lab exclusion (iOS bundle)
        run: node scripts/lab/assertLabExcluded.mjs --platform ios
        working-directory: mobile/KokonadaHealth

  mobile-android-compile:
    name: Mobile — Android compile check
    runs-on: ubuntu-latest
    # Only when Android-native surface could break — jest already gates JS/TS on every PR.
    # Catches the class of failure jest cannot: manifest-merge errors and unresolved resource
    # refs (e.g. a missing R.style.BootTheme) that crash MainActivity.onCreate() at launch
    # (PR #103 Resilience Audit, HIGH). Deliberately NOT a full `assembleDebug` — resource
    # linking + manifest merge + Kotlin/Java compile are the failing tasks; the Skia CMake
    # native build (~15 min) runs later at packageDebug and is proven by the on-device
    # installDebug in the Squad-6 re-pass, so we skip it here to keep the PR gate fast.
    # The job always starts (so it can be a required check) but the paths-filter below skips
    # the costly steps on PRs that don't touch the Android surface.
    permissions:
      contents: read
      # dorny/paths-filter resolves the changed-file set through listFiles(pull_number) on
      # pull_request events; without this scope the filter 403s and the job dies at step 2.
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Detect Android-affecting changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            android:
              - 'mobile/KokonadaHealth/android/**'
              - 'mobile/KokonadaHealth/package.json'
              - 'mobile/KokonadaHealth/package-lock.json'
              - 'mobile/KokonadaHealth/scripts/lab/**'
              - 'mobile/KokonadaHealth/modules/**'
              - 'mobile/KokonadaHealth/index*.js'
              - '.github/workflows/ci.yml'
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.android == 'true'
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mobile/KokonadaHealth/package-lock.json
      - uses: actions/setup-java@v4
        if: steps.changes.outputs.android == 'true'
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v4
        if: steps.changes.outputs.android == 'true'
      - name: Install JS dependencies
        if: steps.changes.outputs.android == 'true'
        run: npm ci
        working-directory: mobile/KokonadaHealth
      - name: Gradle — resource link + manifest merge + Kotlin/Java compile
        if: steps.changes.outputs.android == 'true'
        # gradlew is committed without the execute bit (authored on Windows), so actions/checkout
        # lays it down non-executable → exit 126. chmod it before invoking.
        run: chmod +x gradlew && ./gradlew :app:processDebugResources :app:compileDebugKotlin :app:compileDebugJavaWithJavac --console=plain
        working-directory: mobile/KokonadaHealth/android
      # MB-084: merge the release and lab manifests and compile both variants' Kotlin, then check that
      # release declares and compiles no Design Lab, and that the lab declares none of the real app
      # (no MainActivity, network, health or Bluetooth permission, or real-app scheme). The scripts
      # exit 2 when there is nothing to check, so a skipped merge cannot pass.
      - name: Design Lab — merged manifests and release classes
        if: steps.changes.outputs.android == 'true'
        run: |
          ./gradlew :app:processReleaseMainManifest :app:processLabMainManifest :app:compileLabKotlin :app:compileReleaseKotlin :app:createBundleReleaseJsAndAssets --console=plain
          node ../scripts/lab/assertManifests.mjs
          node ../scripts/lab/assertLabExcluded.mjs --scan app/build/tmp/kotlin-classes/release
          # Positive control: the same scan must FIND the lab in the lab's own classes (exit 1 exactly);
          # 0 or 2 means it could not see a lab class, so the release result above proves nothing.
          rc=0; node ../scripts/lab/assertLabExcluded.mjs --scan app/build/tmp/kotlin-classes/lab || rc=$?
          test "$rc" -eq 1
          # The real release task's own outputs: bytecode, packager/compiler maps, composed map.
          test -s app/build/generated/assets/react/release/index.android.bundle
          test -s app/build/intermediates/sourcemaps/react/release/index.android.bundle.packager.map
          node ../scripts/lab/assertLabExcluded.mjs --scan app/build/generated/assets/react/release app/build/intermediates/sourcemaps/react/release app/build/generated/sourcemaps/react/release
          # QA-077 B 6a: the compiler map and the composed map exist and are non-empty too.
          test -s app/build/intermediates/sourcemaps/react/release/index.android.bundle.compiler.map
          test -s app/build/generated/sourcemaps/react/release/index.android.bundle.map
        working-directory: mobile/KokonadaHealth/android

  # Cheap Ubuntu job whose only purpose is to decide whether the 10x macOS runner is worth
  # allocating. It exists because gating the STEPS was not enough — see mobile-ios-build.
  ios-changes:
    name: Detect iOS-affecting changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # dorny/paths-filter resolves the changed-file set through listFiles(pull_number).
      pull-requests: read
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          # `.github/workflows/ci.yml` IS DELIBERATELY *NOT* IN THIS LIST — and the reason is a
          # measured cost, not a preference.
          #
          # It used to be, which made EVERY edit to this file an "iOS-affecting change". PR #187
          # deleted the web frontend: 180 files, 273 insertions, 27,871 deletions, ZERO files under
          # mobile/ — and it still bought a full `pod install` + `xcodebuild`, 18m18s on a macOS
          # runner billed at 10x, i.e. ~183 quota-minutes. The merge commit changes this file too,
          # so it would have been charged a SECOND time on the push to main.
          #
          # That is not a rounding error. When this allowance ran out on 2026-08-27 the effect was
          # not a slower pipeline: every run was refused at dispatch with steps=0 for five days,
          # and because the backend deploys through Railway's "wait for CI" gate, a security fix
          # that was already merged could not reach production. A quota lockout blocks deploys, not
          # just checks. The Actions budget is a P0 resource.
          #
          # ACCEPTED TRADE-OFF, stated so nobody "fixes" it back: a change to THIS file that breaks
          # the iOS job will not be caught until a real iOS-surface change arrives. An earlier
          # version of this comment called narrowing the filter a trade of the job's purpose "for a
          # few cents". The actual price turned out to be days of blocked work, so the trade goes
          # the other way.
          #
          # Everything below stays. package.json / package-lock.json are in the list because an
          # autolinked native module is exactly what this job exists to catch, and a
          # dependency change is how one arrives — react-native-vector-icons and
          # lottie-react-native were both autolinked with codegen before they were dropped.
          # Narrowing this to ios/** would trade the job's whole purpose for a few cents.
          filters: |
            ios:
              - 'mobile/KokonadaHealth/ios/**'
              - 'mobile/KokonadaHealth/package.json'
              - 'mobile/KokonadaHealth/package-lock.json'
              - 'mobile/KokonadaHealth/Gemfile'
              - 'mobile/KokonadaHealth/react-native.config.js'

  mobile-ios-build:
    name: Mobile — iOS build
    runs-on: macos-latest
    # jest and the Android compile job cannot see the iOS native surface at all, and neither can
    # a Metro bundle check — a JS bundle builds fine with a native module half-removed. This job
    # is the only thing in CI that actually compiles the iOS app, so it is what closes an
    # autolinked-native-module change.
    # Simulator SDK + CODE_SIGNING_ALLOWED=NO: no certificates or provisioning profiles needed,
    # while still compiling every pod and every native module for real.
    #
    # THE JOB IS GATED, NOT ITS STEPS — and that distinction is the whole point.
    # This job used to start unconditionally and skip its steps via an in-job paths-filter, with
    # the comment "the job always starts so it can be a required check". That was wrong twice:
    #   · COST — a job that starts ALLOCATES A macOS RUNNER AND IS BILLED FOR IT at 10x, even
    #     when every step skips. The repo therefore paid 10x on essentially every PR to run
    #     nothing, which is what exhausted the Actions allowance (usage climbed from zero on
    #     2026-08-17 to ~$14.20 by 2026-08-27 against a $0 budget with stop-usage at 100%,
    #     after which every run was refused at dispatch with steps=0).
    #   · HONESTY (OPS-010) — a job whose steps all skip still reports SUCCESS. A green check
    #     that compiled nothing is indistinguishable in the UI from one that compiled everything,
    #     which is one of the ways a green check in this repo has meant nothing.
    # `needs` + `if` fixes both at once: a job skipped by `if:` is never allocated a runner (zero
    # macOS cost) and reports **skipped**, not success — visibly absent instead of silently green.
    needs: ios-changes
    if: needs.ios-changes.outputs.ios == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mobile/KokonadaHealth/package-lock.json
      # `pod install` reads react_native_pods.rb out of node_modules, so JS deps come first.
      - name: Install JS dependencies
        run: npm ci
        working-directory: mobile/KokonadaHealth
      - uses: ruby/setup-ruby@v1
        with:
          # An explicit version is REQUIRED: the action reads `.ruby-version` or `.tool-versions`,
          # neither of which this repo has, and the Gemfile's `ruby ">= 2.6.10"` is a range rather
          # than a pin so it cannot supply one. Without this the job dies before CocoaPods runs.
          # 3.3 satisfies that floor and is a version CocoaPods 1.13+ is happy on.
          ruby-version: '3.3'
          # The Gemfile pins cocoapods away from the versions that break the build; honour it
          # rather than using whatever the runner image ships. No Gemfile.lock is committed, so
          # this resolves fresh each run — reproducibility is a known gap, tracked separately.
          bundler-cache: true
          working-directory: mobile/KokonadaHealth
      - name: CocoaPods install
        run: bundle exec pod install
        working-directory: mobile/KokonadaHealth/ios
      - name: Xcode build (simulator, unsigned)
        run: |
          xcodebuild \
            -workspace KokonadaHealth.xcworkspace \
            -scheme KokonadaHealth \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
        working-directory: mobile/KokonadaHealth/ios

  # The backend deploys via Railway's NATIVE GitHub integration: the service is
  # connected to this repo with Root Directory = /backend, branch = main, "auto-deploy
  # on push" + "wait for CI" enabled. Railway builds backend/Dockerfile itself once
  # these CI checks pass — so there is intentionally no `railway up` job here. A CLI
  # `railway up` from this repo fights the service's Root Directory (/backend) and fails
  # the build in ~2s; worse, that failed check made "wait for CI" block the native
  # deploy. Keep backend deploys native; CI only needs to go green.

