name: Deploy Project Explorer to GitHub Pages

on:
  push:
    branches:
      - docs/project-explorer-design
    paths:
      - project-explorer/**
      - .github/workflows/project-explorer-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: project-explorer-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Project Explorer
        uses: actions/upload-pages-artifact@v3
        with:
          path: project-explorer

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
