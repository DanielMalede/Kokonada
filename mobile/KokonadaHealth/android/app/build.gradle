apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// MB-084: the React Native plugin reads the ENTRY_FILE environment variable for EVERY variant,
// release included, so one variable would put another entry (the Design Lab's index.lab.js) into a
// build that can be uploaded. Nothing here uses it; refuse to configure while it is set.
if (System.getenv("ENTRY_FILE") != null) {
    throw new GradleException("ENTRY_FILE is set (" + System.getenv("ENTRY_FILE") + "). It would replace the JS entry " +
        "of every variant, release included. Unset it; the Design Lab is bundled by scripts/lab instead (MB-084).")
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]
    //
    // The Design Lab (MB-084): `lab` is listed so the plugin never bundles index.js into it. The lab's
    // own bundle (index.lab.js, Hermes, --dev false) is written to src/lab/assets by scripts/lab.
    debuggableVariants = ["debug", "debugOptimized", "lab"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    // MB-084: named explicitly, so an index.android.js (which the plugin would otherwise prefer) can
    // never become the release entry. labExclusion.test.ts pins this line and that no such file exists.
    entryFile = file("../../index.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Release signing — credentials live in android/keystore.properties (gitignored, never committed).
// When that file is absent (fresh clone / CI), the release build falls back to debug signing so the
// build still succeeds; a real signed release only happens where the keystore + properties exist.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.kokonadahealth"
    defaultConfig {
        applicationId "com.kokonadahealth"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        // Spotify App Remote / auth SDK: its LoginActivity manifest declares an
        // intent-filter using these placeholders to catch the auth redirect. Values
        // decompose SPOTIFY_REDIRECT_URI (kokonadahealth://spotify-callback) and must
        // match the redirect URI registered in the Spotify dashboard.
        manifestPlaceholders = [redirectSchemeName: "kokonadahealth", redirectHostName: "spotify-callback"]
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Standalone production build: signed with the real Kokonada release keystore when
            // android/keystore.properties is present (local/production), else debug-signed (CI /
            // fresh clone) so the build never fails for lack of the secret. The JS bundle is embedded
            // (release is NOT a debuggableVariant), so the installed app runs with no Metro bundler.
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
        // The Design Lab (MB-084): release-equivalent (not debuggable, Hermes, JS built with --dev
        // false) but a separate package that installs beside the real app, signed with the DEBUG key
        // even where the release key exists, and never uploaded. Its manifest and its activity live in
        // src/lab, which merges into this build type alone. scripts/lab/assertManifests.mjs and
        // scripts/lab/assertLabExcluded.mjs check that no other variant carries any of it.
        lab {
            initWith release
            applicationIdSuffix ".lab"
            signingConfig signingConfigs.debug
            // Libraries publish debug and release only.
            matchingFallbacks = ["release"]
            // The React Native plugin sets usesCleartextTraffic for debug, release and debugOptimized
            // only. The Spotify redirect is pointed at a scheme nothing sends, so the lab can never
            // catch the real app's kokonadahealth://spotify-callback.
            manifestPlaceholders = [
                usesCleartextTraffic: "false",
                redirectSchemeName  : "kokonadalab-unused",
                redirectHostName    : "never"
            ]
        }
    }
}

// Two refusals for the Design Lab (MB-084), decided from the task graph so they hold on every run,
// a dry run included, whatever Gradle considers up to date:
//   · an App Bundle is the format Play Console takes, and the lab is never uploaded, so it is never one;
//   · a lab APK carries the bundle scripts/lab writes, and without it the app would start with no JS.
//     Only packaging needs it, so the manifest and Kotlin tasks still run without one.
gradle.taskGraph.whenReady { graph ->
    def planned = graph.allTasks.findAll { it.project == project }*.name
    def aab = planned.find { it in ["bundleLab", "packageLabBundle", "signLabBundle"] }
    if (aab != null) {
        throw new GradleException("The Design Lab is never built as an App Bundle (" + aab + "): it is never " +
            "uploaded to Play Console on any track (MB-084).")
    }
    def packaging = planned.find { it in ["mergeLabAssets", "packageLab"] }
    if (packaging != null && !file("src/lab/assets/index.android.bundle").isFile()) {
        throw new GradleException("The Design Lab bundle is missing: src/lab/assets/index.android.bundle (needed by " +
            packaging + "). Build it with the lab scripts (scripts/lab) before assembling the lab (MB-084).")
    }
}

// MB-084 (round-1 review, MF-2): whatever route puts JS into an app variant's assets (the RN plugin,
// a hand-made bundle in src/main/assets, anything else), the merged assets of every variant that is
// not the lab must not hold the Design Lab sentinel. Checked on the merge task's real output.
def labSentinel = {
    def m = file("../../src/design/lab/sentinel.ts").text =~ /(?m)^export const LAB_SENTINEL = '([a-z0-9-]{16,})';$/
    if (!m.find()) throw new GradleException("src/design/lab/sentinel.ts must declare LAB_SENTINEL as one literal (MB-084)")
    new String(m.group(1).getBytes("UTF-8"), "ISO-8859-1")
}
tasks.matching { it.name ==~ /^merge\w*Assets$/ && !(it.name ==~ /^merge\w*LabAssets$/) }.configureEach { t ->
    t.doLast {
        def needle = labSentinel()
        t.outputs.files.each { root -> if (root.exists()) root.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            if (new String(f.bytes, "ISO-8859-1").contains(needle))
                throw new GradleException("${t.name}: ${f} holds the Design Lab sentinel; the lab is never packaged into an uploadable variant (MB-084).")
        } }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
