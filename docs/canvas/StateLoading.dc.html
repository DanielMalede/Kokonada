<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@400;500;600&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./tokens.css">
  <style>
    body { margin: 0; background: var(--pagebg, #E8E9EF); }
    a { color: #17536F; } a:hover { color: #14163A; }
@keyframes skel { 0%,100% { opacity:.6; } 50% { opacity:1; } }
    .sk { background:var(--track); opacity:.28; border-radius:999px; animation:skel 4200ms ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .sk { animation:none; } }
  </style>
</helmet>

<div class="qi" data-theme="{{theme}}" style="width:390px;height:844px;position:relative;overflow:hidden;background:var(--canvas);font-family:var(--text);display:flex;flex-direction:column">

  <div style="height:44px;flex:none"></div>
  <div style="position:relative;flex:1;min-height:0;padding:8px 22px 12px" role="status" aria-live="polite" aria-label="Reading your body">
    <span class="sk" style="display:block;width:62%;height:30px;margin-bottom:12px"></span>
    <span class="sk" style="display:block;width:38%;height:11px;margin-bottom:20px"></span>
    <div style="display:flex;gap:8px;margin-bottom:18px">
      <span class="sk" style="flex:1;height:92px;border-radius:16px;animation-delay:80ms"></span>
      <span class="sk" style="flex:1;height:92px;border-radius:16px;animation-delay:160ms"></span>
    </div>
    <span class="sk" style="display:block;width:100%;height:52px;margin-bottom:22px;border-radius:14px;animation-delay:240ms"></span>
    <span class="sk" style="display:block;width:44%;height:11px;margin-bottom:14px;animation-delay:320ms"></span>
    <div style="display:flex;flex-direction:column;gap:16px">
      <div><span class="sk" style="display:block;width:100%;height:13px;margin-bottom:6px;animation-delay:400ms"></span><span class="sk" style="display:block;width:100%;height:8px;animation-delay:400ms"></span></div>
      <div><span class="sk" style="display:block;width:100%;height:13px;margin-bottom:6px;animation-delay:480ms"></span><span class="sk" style="display:block;width:100%;height:8px;animation-delay:480ms"></span></div>
      <div><span class="sk" style="display:block;width:100%;height:13px;margin-bottom:6px;animation-delay:560ms"></span><span class="sk" style="display:block;width:100%;height:8px;animation-delay:560ms"></span></div>
    </div>
    <div style="margin-top:26px;font:400 12.5px var(--text);color:var(--ink2)">Reading your body…</div>
  </div>
  <div style="position:relative;display:flex;justify-content:space-around;align-items:center;height:62px;flex:none;border-top:1px solid var(--line);background:var(--canvas)">
    <span style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:56px;min-height:44px" role="tab" aria-label="GENERATE" aria-selected="false">
      <svg width="22" height="22" viewBox="0 0 20 20" fill="var(--ink3)" aria-hidden="true"><circle cx="10" cy="10" r="9"></circle><path d="M3 10 q2.3 -4 4.6 0 t4.6 0 t4.6 0" fill="none" stroke="var(--canvas)" stroke-width="1.7" stroke-linecap="round"></path></svg>
    </span>
    <span style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:56px;min-height:44px" role="tab" aria-label="NOW PLAYING" aria-selected="false">
      <svg width="22" height="22" viewBox="0 0 20 20" fill="var(--ink3)" aria-hidden="true"><path d="M4 3v14l12-7z"></path></svg>
    </span>
    <span style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:56px;min-height:44px" role="tab" aria-label="PULSE" aria-selected="true">
      <svg width="22" height="22" viewBox="0 0 20 20" fill="var(--accent)" aria-hidden="true"><path d="M1 12 q2 0 3-3 t2 6 t2-6 t2 3 h9 v2 H1z"></path></svg>
      <span style="font:500 11px var(--mono);letter-spacing:.06em;color:var(--accent);white-space:nowrap">PULSE</span>
    </span>
    <span style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:56px;min-height:44px" role="tab" aria-label="HISTORY" aria-selected="false">
      <svg width="22" height="22" viewBox="0 0 20 20" fill="var(--ink3)" aria-hidden="true"><rect x="2" y="4" width="16" height="2.6" rx="1.3"></rect><rect x="2" y="9" width="16" height="2.6" rx="1.3"></rect><rect x="2" y="14" width="11" height="2.6" rx="1.3"></rect></svg>
    </span>
    <span style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:56px;min-height:44px" role="tab" aria-label="PROFILE" aria-selected="false">
      <svg width="22" height="22" viewBox="0 0 20 20" fill="var(--ink3)" aria-hidden="true"><circle cx="10" cy="6.5" r="3.6"></circle><path d="M2.6 18a7.4 7.4 0 0 1 14.8 0z"></path></svg>
    </span>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
