<!doctype html>
<html>
<head>
  <meta charset="utf-8">

<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@400;500;600&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./tokens.css">
  <style>
    body { margin: 0; background: var(--pagebg, #E8E9EF); }
@keyframes breathe { 0%,100% { opacity:.45; transform:scale(1); } 50% { opacity:.75; transform:scale(1.04); } }
    @keyframes glowbreath { 0%,100% { opacity:.45; } 50% { opacity:.75; } }

    .fldwrap { position:absolute; inset:0; overflow:hidden; pointer-events:none; opacity:1; }
    .fld1, .fld2 { position:absolute; }
    .fld1 { left:-20%; right:-20%; bottom:-26%; height:78%; animation:fieldbreath 4200ms ease-in-out infinite; }
    .fld2 { left:-32%; right:4%; bottom:-6%; height:54%; animation:fieldbreath var(--d-field) ease-in-out infinite 1400ms; }
    @keyframes fieldbreath { 0%,100% { opacity:.45; transform:scale(1); } 50% { opacity:.75; transform:scale(1.04); } }
    .qi[data-theme="dark"] .fldwrap { opacity:0.90; }
    .qi[data-field="off"] .fldwrap { display:none; }
    .qi[data-field="calm"] .fld1 { height:74%; background:radial-gradient(ellipse 62% 100% at 50% 100%,var(--accentfill),transparent 74%); }
    .qi[data-field="calm"] .fld2 { background:radial-gradient(ellipse 60% 100% at 32% 100%,var(--accentfill),transparent 70%); }
    .qi[data-field="joyful"] .fld1 { height:86%; background:radial-gradient(ellipse 62% 100% at 50% 100%,var(--accentfill),transparent 74%); }
    .qi[data-field="joyful"] .fld2 { background:radial-gradient(ellipse 60% 100% at 32% 100%,var(--accentfill),transparent 70%); }
    .qi[data-field="intense"] .fld1 { height:68%; background:radial-gradient(ellipse 62% 100% at 50% 100%,var(--accentfill),transparent 74%); }
    .qi[data-field="intense"] .fld2 { background:radial-gradient(ellipse 60% 100% at 32% 100%,var(--accentfill),transparent 70%); }
    .qi[data-field="reflective"] .fld1 { height:62%; background:radial-gradient(ellipse 62% 100% at 50% 100%,var(--accentfill),transparent 74%); }
    .qi[data-field="reflective"] .fld2 { background:radial-gradient(ellipse 60% 100% at 32% 100%,var(--accentfill),transparent 70%); }
    @media (prefers-reduced-motion: reduce) {
      .fld1, .fld2 { animation: none !important; opacity:.6 !important; transform:scale(1.02) !important; }
      [style*="animation:breathe"], [style*="animation:glowbreath"] { animation: none !important; opacity:.55 !important; }
    }
</style>
</helmet>

  <div aria-busy="true" aria-live="polite" style="position:absolute;left:0;right:0;bottom:96px;padding:0 34px;text-align:center">
    <div style="font:600 19px/1.4 var(--disp);color:var(--ink)">{{say}}</div>
    <sc-if value="{{isSlow}}" hint-placeholder-val="{{ true }}">
      <div style="margin-top:8px;font:400 13px/1.5 var(--text);color:var(--ink2)">Still going. It can take up to half a minute.</div>
    </sc-if>
    <div style="margin-top:12px;display:flex;justify-content:center;gap:6px" aria-hidden="true">
      <span style="display:block;width:22px;height:8px;border-radius:999px;background:var(--accent)"></span>
      <span style="display:block;width:22px;height:8px;border-radius:999px;background:{{tick2}}"></span>
      <span style="display:block;width:22px;height:8px;border-radius:999px;background:{{tick3}};outline:{{tick3outline}}"></span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"field":{"editor":"enum","options":["intense","calm","joyful","reflective","off"],"default":"intense"},"state":{"editor":"enum","options":["working","slow","resolved"],"default":"slow"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const state = this.props.state ?? 'slow';
    // The meter is DECORATIVE rhythm, not a progress claim: generationStatusStore has one
    // boolean, so there is no step index to announce. aria-hidden on the ticks + aria-busy
    // on the region keeps the screen reader truthful while the visual stays as drawn.
    const filled = state === 'resolved' ? 3 : 2;
    const off = 'var(--bartrack)';
    return {
      theme: this.props.theme ?? 'light',
      field: this.props.field ?? 'intense',
      isSlow: state === 'slow',
      say: state === 'resolved' ? "It's ready." : 'Sitting with the shape of it.',
      tick2: filled >= 2 ? 'var(--accent)' : off,
      tick3: filled >= 3 ? 'var(--accent)' : off,
      tick3outline: filled >= 3 ? 'none' : '1px solid var(--track)',
    };
  }
}
</script>
</body>
</html>
